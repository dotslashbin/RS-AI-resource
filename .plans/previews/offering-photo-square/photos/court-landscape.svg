<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Invented fixture: a 3:2 landscape "photo". The hoop sits near the RIGHT edge on purpose,
       so a centre square crop visibly loses the subject. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc8f0"/><stop offset="1" stop-color="#dbeaf7"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <rect y="230" width="600" height="170" fill="#c9773d"/>
  <path d="M0 300 H600 M300 230 V400" stroke="#fff" stroke-width="4"/>
  <ellipse cx="300" cy="300" rx="60" ry="22" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="40" y="150" width="14" height="150" fill="#3b3b3b"/>
  <rect x="540" y="90" width="14" height="210" fill="#3b3b3b"/>
  <rect x="478" y="80" width="70" height="50" fill="#fff" stroke="#3b3b3b" stroke-width="4"/>
  <ellipse cx="490" cy="140" rx="22" ry="6" fill="none" stroke="#e4572e" stroke-width="5"/>
  <circle cx="455" cy="200" r="16" fill="#e4572e"/>
</svg>
